name: One-time Forex project migration

on:
  push:
    paths:
      - ".github/workflows/migrate-from-game-siam.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if migration is already complete
        id: guard
        shell: bash
        run: |
          if [ -f .migration-complete ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone source branch
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch codex/forex-auto-trader-mvp \
            https://github.com/Fargolff/GAME-SIAM.git "$RUNNER_TEMP/GAME-SIAM"

      - name: Copy Phase 1-10 project to repository root
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          cp -a "$RUNNER_TEMP/GAME-SIAM/forex-auto-trader/." .
          sed -i 's/^cd forex-auto-trader$/# already at repository root/' README.md
          sed -i 's/^forex-auto-trader\/$/Forex-trade\//' README.md
          printf '%s\n' \
            'source_repository=Fargolff/GAME-SIAM' \
            'source_branch=codex/forex-auto-trader-mvp' \
            'source_subdirectory=forex-auto-trader' \
            "migrated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > .migration-complete

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate migrated project
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "pytest>=8.0"
          PYTHONPATH=. python -m pytest -q
          PYTHONPATH=. python -m src.soak --cycles 300

      - name: Commit standalone project
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md config.example.yaml production.example.yaml watchdog.example.yaml requirements.txt src tests docs deploy .gitignore .migration-complete
          git commit -m "feat: migrate Forex auto trader Phase 1-10 into standalone repository"
          git push origin HEAD:main
