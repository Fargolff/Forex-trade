name: Phase 29 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate
    paths:
      - tools/phase29_apply.py
      - .github/workflows/phase29-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Apply Phase 29
        run: python tools/phase29_apply.py

      - name: Fix Phase 29 trust-store regression fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_phase29_key_policy.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'sign_ci_attestation(root, private_key_path=paths["ci-new-private"])\n    store_path = root / DEFAULT_TRUST_STORE',
              'sign_ci_attestation(root, private_key_path=paths["ci-new-private"], trust_store_path=DEFAULT_TRUST_STORE)\n    store_path = root / DEFAULT_TRUST_STORE',
              1,
          )
          text = text.replace(
              'report = verify_ci_attestation(root, expected_source_commit="c" * 40)\n    assert report["ok"] is False',
              'report = verify_ci_attestation(root, expected_source_commit="c" * 40, trust_store_path=DEFAULT_TRUST_STORE)\n    assert report["ok"] is False',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 29 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md signing_key_trust.example.json docs/phase29-key-rotation.md src/key_policy.py src/recovery.py src/release.py src/artifact.py src/ci_attestation.py src/release_ceremony.py tests/test_phase27_release_ceremony.py tests/test_phase29_key_policy.py
          if git diff --cached --quiet; then
            echo "No Phase 29 source changes to commit."
            exit 0
          fi
          git commit -m "feat: add signing-key lifecycle policy"
          git push origin HEAD:codex/phase11-signed-release-gate
