name: Phase 31 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate
    paths:
      - tools/phase31_apply.py
      - .github/workflows/phase31-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Apply Phase 31
        run: python tools/phase31_apply.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 31 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md signing_key_trust.example.json deploy/windows/run-live-supervisor.ps1 docs/phase31-runtime-boot.md src/runtime_boot.py src/key_policy.py tests/test_phase31_runtime_boot.py
          if git diff --cached --quiet; then
            echo "No Phase 31 source changes to commit."
            exit 0
          fi
          git commit -m "feat: add runtime boot attestation"
          git push origin HEAD:codex/phase11-signed-release-gate
