name: Phase 20 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Normalize Phase 20 anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("config.example.yaml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  max_future_bar_seconds: 300\n\n  deal_reconcile_lookback_hours: 72\n',
              '  max_future_bar_seconds: 300\n  deal_reconcile_lookback_hours: 72\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Phase 20
        run: python tools/phase20_apply.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 20
        run: |
          if git diff --quiet; then
            echo "No Phase 20 source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session_calibration.py src/config.py src/live.py src/main.py config.example.yaml tests/test_phase20_session_calibration.py docs/phase20-session-calibration.md README.md
          git commit -m "feat: add broker session calibration and clock watchdog"
          git push origin HEAD:codex/phase11-signed-release-gate
