name: Phase 22 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Apply Phase 22
        run: python tools/phase22_apply.py

      - name: Run Phase 22 tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_phase22_paper_warm_start.py tests/test_paper.py

      - name: Run full tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 22
        run: |
          if git diff --quiet; then
            echo "No Phase 22 source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/paper.py src/main.py tests/test_phase22_paper_warm_start.py docs/phase22-forward-only-paper.md README.md
          git commit -m "feat: enforce forward-only MT5 paper warm start"
          git push origin HEAD:codex/phase11-signed-release-gate
