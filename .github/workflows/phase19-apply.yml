name: Phase 19 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Apply Phase 19
        run: python tools/phase19_apply.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 19
        run: |
          if git diff --quiet; then
            echo "No Phase 19 source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/market_clock.py src/ops.py src/config.py src/live.py src/main.py config.example.yaml tests/test_phase19_market_clock.py docs/phase19-market-clock.md README.md
          git commit -m "feat: add market-session and clock safety"
          git push origin HEAD:codex/phase11-signed-release-gate
