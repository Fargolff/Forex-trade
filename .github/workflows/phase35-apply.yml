name: Phase 35 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate
    paths:
      - .github/workflows/phase35-apply.yml
      - tools/phase35_apply.py
      - tools/phase35_apply_v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Apply and validate Phase 35
        env:
          PYTHONPATH: .
        run: |
          set +e
          : > /tmp/phase35_debug.log
          python tools/phase35_apply_v2.py >> /tmp/phase35_debug.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            python -m pytest -q tests/test_phase35_watcher_quorum.py >> /tmp/phase35_debug.log 2>&1
            rc=$?
          fi
          if [ $rc -eq 0 ]; then
            python -m pytest -q >> /tmp/phase35_debug.log 2>&1
            rc=$?
          fi
          if [ $rc -eq 0 ]; then
            python -m src.soak --cycles 300 >> /tmp/phase35_debug.log 2>&1
            rc=$?
          fi
          cat /tmp/phase35_debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ $rc -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/phase35_debug.log tools/phase35_debug.log
            git add tools/phase35_debug.log
            git commit -m "chore: capture Phase 35 validation failure"
            git push origin HEAD:codex/phase11-signed-release-gate
            exit $rc
          fi
          rm -f tools/phase35_debug.log
          git add .gitignore src/watcher_quorum.py tests/test_phase35_watcher_quorum.py docs/phase35-watcher-quorum.md watcher_quorum.example.yaml watcher_quorum_trust.example.yaml deploy/windows/run-remote-watcher.ps1 deploy/windows/run-watcher-quorum-verify.ps1
          git commit -m "feat: add multi-observer watcher quorum Phase 35"
          git push origin HEAD:codex/phase11-signed-release-gate
