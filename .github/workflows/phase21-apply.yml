name: Phase 21 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "numpy>=2.0" "PyYAML>=6.0" "cryptography>=43.0" "pytest>=8.0"

      - name: Normalize Phase 21 patch markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/phase21_apply.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"def validation_summary(\\n",', '"def validation_summary(",', 1)
          text = text.replace('"def save_portfolio_report(\\n",', '"def save_portfolio_report(",', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Phase 21
        run: python tools/phase21_apply.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Run operational soak
        env:
          PYTHONPATH: .
        run: python -m src.soak --cycles 300

      - name: Commit validated Phase 21
        run: |
          if git diff --quiet; then
            echo "No Phase 21 source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/validation.py src/portfolio.py tests/test_phase21_oos_integrity.py docs/phase21-untouched-oos.md README.md
          git commit -m "feat: enforce true untouched OOS portfolio research"
          git push origin HEAD:codex/phase11-signed-release-gate
