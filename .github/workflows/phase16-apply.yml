name: Phase 16 Apply

on:
  push:
    branches:
      - codex/phase11-signed-release-gate
    paths:
      - tools/phase16_apply.py
      - .github/workflows/phase16-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase11-signed-release-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 16 migration
        run: python tools/phase16_apply.py
      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mt5_broker.py src/live.py README.md
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "feat: add fail-closed execution reconciliation"
          git push origin HEAD:codex/phase11-signed-release-gate
