mode: backtest
symbol: EURUSD
timeframe: H1
data_dir: data

initial_equity: 10000
risk_per_trade: 0.005
max_daily_loss_pct: 0.02
max_drawdown_pct: 0.10

# Cost assumptions must be realistic for your broker/account type.
spread_pips: 0.8
slippage_pips: 0.2
commission_per_lot_round_turn: 7.0

# Phase 23 synthetic financing assumptions for backtest and paper only.
# Values are account-currency cash per lot for a 1x rollover. Positive = credit,
# negative = cost. Do not copy MT5 swap_long/swap_short blindly unless you have
# confirmed the broker's swap_mode/unit conversion. Default remains disabled.
financing:
  enabled: false
  long_cash_per_lot_rollover: 0.0
  short_cash_per_lot_rollover: 0.0
  rollover_hour_utc: 22
  # Monday..Sunday. Default models Wednesday triple swap and no weekend event.
  weekday_multipliers: [1, 1, 3, 1, 1, 0, 0]

strategy:
  name: ema_trend
  params:
    fast: 20
    slow: 50
    atr_period: 14
    stop_atr: 2.0
    take_profit_atr: 3.0

# Phase 6 paper trading consumes the Phase 5 portfolio files.
# MT5 is used only for market data; no real order is sent.
paper:
  state_path: runtime/paper_state.json
  events_path: runtime/paper_events.csv
  weights_path: results/portfolio/portfolio_weights.csv
  candidates_path: results/portfolio/portfolio_candidates.csv
  poll_seconds: 30
  history_bars: 5000

# Phase 7/8 live execution is intentionally disabled by default.
# Enabling this flag is still not enough to trade: the CLI also requires the
# explicit operator arming phrase. Live mode supports MT5 hedging accounts only.
live:
  enabled: false
  magic: 56001
  deviation_points: 20
  risk_per_trade: 0.0025
  max_daily_loss_pct: 0.01
  max_drawdown_pct: 0.05
  max_lot_per_order: 0.02
  max_total_lots: 0.05
  max_open_positions: 3
  max_spread_pips: 2.0

  # Phase 15 broker/account safety. When live.enabled=true, configure the exact
  # MT5 login IDs that are allowed to receive orders. An empty allowlist fails.
  allowed_account_logins: []
  require_account_allowlist: true
  # Projected margin after each new order must remain below 25% of equity, and
  # projected free margin must remain at least 50% of equity.
  max_margin_fraction_of_equity: 0.25
  min_free_margin_fraction_after_order: 0.50

  # Phase 8 production-health gates.
  max_tick_age_seconds: 30
  # 0 = auto derive as 2.5 x configured timeframe duration.
  max_bar_age_seconds: 0

  # Phase 19 FX weekly-session and timestamp safety. The one-hour transition
  # window absorbs common DST/broker boundary shifts and blocks new entries.
  market_session_enabled: true
  market_sunday_open_utc: "22:00"
  market_friday_close_utc: "22:00"
  market_transition_grace_seconds: 3600
  max_future_tick_seconds: 5
  max_future_bar_seconds: 300

  # Phase 20 conservative broker-session calibration. Learned evidence may only
  # narrow the Phase 19 static session; it can never expand trading hours.
  session_calibration_enabled: true
  session_calibration_state_path: runtime/session_calibration.json
  session_calibration_min_samples: 3
  session_calibration_safety_buffer_minutes: 15
  session_calibration_max_narrowing_minutes: 180
  session_calibration_retention_weeks: 12
  clock_watchdog_window_size: 12
  clock_watchdog_min_samples: 5
  max_persistent_clock_offset_seconds: 60

  deal_reconcile_lookback_hours: 72
  max_reconnect_attempts: 3
  reconnect_backoff_seconds: 5

  state_path: runtime/live_state.json
  events_path: runtime/live_events.csv
  heartbeat_path: runtime/live_heartbeat.json
  incidents_path: runtime/live_incidents.csv
  weights_path: results/portfolio/portfolio_weights.csv
  candidates_path: results/portfolio/portfolio_candidates.csv
  poll_seconds: 30
  history_bars: 5000
